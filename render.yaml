services:
  - type: web
    name: cafeteria-igreja-onda
    runtime: static
    buildCommand: "true"
    staticPublishPath: ./
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /app.js
        name: Cache-Control
        value: no-cache
      - path: /config.js
        name: Cache-Control
        value: no-cache
